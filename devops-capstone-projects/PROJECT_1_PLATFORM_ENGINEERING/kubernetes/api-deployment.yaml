apiVersion: v1
kind: Namespace
metadata:
  name: saas-production

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: saas-production
data:
  LOG_LEVEL: "info"
  FLASK_ENV: "production"
  DATABASE_POOL_SIZE: "20"
  FLASK_DEBUG: "0"

---
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: saas-production
type: Opaque
stringData:
  DATABASE_PASSWORD: "change-me-in-production"
  JWT_SECRET_KEY: "change-me-in-production"
  REDIS_PASSWORD: "change-me-in-production"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: saas-production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api
      version: v1
  template:
    metadata:
      labels:
        app: api
        version: v1
        team: backend
    spec:
      # Pod Disruption Budget (graceful drains)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - api
              topologyKey: kubernetes.io/hostname
      
      # Service Account
      serviceAccountName: api
      
      # Init container for migrations
      initContainers:
      - name: migrations
        image: api:latest
        command: ["flask", "db", "upgrade"]
        env:
        - name: DATABASE_URL
          value: "postgresql://appuser:$(DATABASE_PASSWORD)@postgres.saas-production:5432/saasdb"
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: DATABASE_PASSWORD
      
      containers:
      - name: api
        image: api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        
        # Environment variables
        env:
        - name: FLASK_ENV
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: FLASK_ENV
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: LOG_LEVEL
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: JWT_SECRET_KEY
        - name: DATABASE_URL
          value: "postgresql://appuser:$(DATABASE_PASSWORD)@postgres.saas-production:5432/saasdb"
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: DATABASE_PASSWORD
        - name: REDIS_HOST
          value: "redis.saas-production"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: REDIS_PASSWORD
        
        # Resource management (CRITICAL)
        resources:
          requests:
            cpu: "500m"        # Reserve 0.5 CPU
            memory: "512Mi"    # Reserve 512MB
          limits:
            cpu: "1000m"       # Max 1 CPU (kill if exceeded)
            memory: "1Gi"      # Max 1GB
        
        # Health checks (self-healing)
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        
        # Volume mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: var-run
          mountPath: /var/run
      
      # Volumes
      volumes:
      - name: tmp
        emptyDir: {}
      - name: var-run
        emptyDir: {}
      
      # Termination grace period (time for graceful shutdown)
      terminationGracePeriodSeconds: 30
      
      # DNS policy
      dnsPolicy: ClusterFirst
      
      # Restart policy
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: saas-production
  labels:
    app: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
  - port: 5000
    targetPort: http
    protocol: TCP
    name: http
  sessionAffinity: None

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: saas-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  
  minReplicas: 3
  maxReplicas: 20
  
  metrics:
  # CPU-based scaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  
  # Memory-based scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  
  # Custom metric (requests per second)
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "1000"
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
      - type: Pods
        value: 1
        periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 60   # Scale up immediately
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-pdb
  namespace: saas-production
spec:
  minAvailable: 2  # Always keep 2+ pods running
  selector:
    matchLabels:
      app: api

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-netpol
  namespace: saas-production
spec:
  podSelector:
    matchLabels:
      app: api
  
  policyTypes:
  - Ingress
  - Egress
  
  # Allow ingress only from Ingress controller
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 5000
  
  # Allow egress to specific services
  egress:
  # DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  
  # PostgreSQL
  - to:
    - namespaceSelector:
        matchLabels:
          name: saas-production
      podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  
  # Redis
  - to:
    - namespaceSelector:
        matchLabels:
          name: saas-production
      podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: saas-production

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-role
  namespace: saas-production
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-rolebinding
  namespace: saas-production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-role
subjects:
- kind: ServiceAccount
  name: api
  namespace: saas-production
