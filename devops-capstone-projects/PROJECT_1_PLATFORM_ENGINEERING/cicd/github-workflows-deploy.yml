name: Build and Deploy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: api
  REGISTRY: 123456789.dkr.ecr.us-east-1.amazonaws.com

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pylint black flake8 safety
    
    - name: Run pylint
      run: pylint backend/ --disable=C0111,C0103 || true
    
    - name: Check code style with black
      run: black --check backend/ || true
    
    - name: Check code style with flake8
      run: flake8 backend/ --max-line-length=100
    
    - name: Check dependencies for vulnerabilities
      run: safety check -r backend/requirements.txt || true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppassword
          POSTGRES_DB: saasdb_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-cov
    
    - name: Run tests with coverage
      env:
        DATABASE_URL: postgresql://appuser:apppassword@localhost:5432/saasdb_test
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        JWT_SECRET_KEY: test-secret
      run: |
        pytest backend/tests/ --cov=backend --cov-report=xml --cov-fail-under=80
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    outputs:
      image: ${{ steps.image.outputs.image }}
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1
    
    - name: Build, tag, and push image to Amazon ECR
      id: image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -f docker/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging-api.example.com
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Update Kubernetes manifests
      run: |
        sed -i 's|image: api:latest|image: ${{ needs.build.outputs.image }}|g' kubernetes/api-deployment.yaml
    
    - name: Update EKS kubeconfig
      run: |
        aws eks update-kubeconfig --name staging-cluster --region ${{ env.AWS_REGION }}
    
    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f kubernetes/
        kubectl rollout status deployment/api -n saas-production --timeout=5m
    
    - name: Run smoke tests
      run: |
        sleep 30  # Wait for pods to be ready
        curl -X GET https://staging-api.example.com/health
        curl -X POST https://staging-api.example.com/api/auth/register \
          -H "Content-Type: application/json" \
          -d '{"email": "test@example.com", "password": "test123", "name": "Test User"}'

  deploy-production:
    name: Deploy to Production (Blue-Green)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.example.com
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Update EKS kubeconfig
      run: |
        aws eks update-kubeconfig --name production-cluster --region ${{ env.AWS_REGION }}
    
    - name: Blue-Green Deployment (10% traffic)
      run: |
        # Create green deployment with new image
        kubectl set image deployment/api api=${{ needs.build.outputs.image }} -n saas-production --dry-run=client -o yaml | kubectl apply -f -
        kubectl rollout status deployment/api -n saas-production --timeout=5m
    
    - name: Monitor metrics (2 minutes)
      run: |
        for i in {1..24}; do
          sleep 5
          ERROR_RATE=$(kubectl get --raw /api/v1/namespaces/saas-production/services/prometheus:9090/proxy/api/v1/query?query=rate\(flask_exceptions_total\[5m\]\) | jq '.data.result[0].value[1]')
          echo "Error rate: $ERROR_RATE"
          if [ "$ERROR_RATE" -gt "1" ]; then
            echo "High error rate detected, rolling back"
            kubectl rollout undo deployment/api -n saas-production
            exit 1
          fi
        done
    
    - name: Proceed to 100% (if metrics good)
      run: |
        echo "Metrics look good, proceeding with full deployment"
        kubectl rollout status deployment/api -n saas-production --timeout=5m
    
    - name: Run post-deployment validation
      run: |
        curl -X GET https://api.example.com/health -f || exit 1
        echo "Deployment successful!"
    
    - name: Notify Slack
      uses: slackapi/slack-github-action@v1.24.0
      with:
        webhook-url: ${{ secrets.SLACK_WEBHOOK }}
        payload: |
          {
            "text": "✅ Production deployment successful",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Deployment Status*\nCommit: ${{ github.sha }}\nImage: ${{ needs.build.outputs.image }}\nStatus: ✅ Successful"
                }
              }
            ]
          }

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy-production
    if: failure()
    
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Update EKS kubeconfig
      run: |
        aws eks update-kubeconfig --name production-cluster --region ${{ env.AWS_REGION }}
    
    - name: Rollback to previous version
      run: |
        kubectl rollout undo deployment/api -n saas-production
        kubectl rollout status deployment/api -n saas-production --timeout=5m
    
    - name: Notify Slack
      uses: slackapi/slack-github-action@v1.24.0
      with:
        webhook-url: ${{ secrets.SLACK_WEBHOOK }}
        payload: |
          {
            "text": "❌ Deployment failed, rolled back",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Rollback Status*\nCommit: ${{ github.sha }}\nStatus: ❌ Rolled back to previous version"
                }
              }
            ]
          }
